# TrueNAS SCALE NVIDIA overlay (intended GPU path). Use with docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Uses the published Docker Hub GPU image. Set the image to
# ghcr.io/paladini/voice-separator:gpu to use GHCR instead.
# Host must expose NVIDIA devices to Docker.

services:
  voice-separator:
    image: paladini/voice-separator:gpu
    gpus: all
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_HOME=/root/.cache/torch
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
