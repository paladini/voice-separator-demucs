# TrueNAS SCALE custom app / Compose.
# CPU default (same contract as docker run -p 7860 paladini/voice-separator).
#
# GPU: Hub has no :gpu tag until the maintainer pushes it. Intended path is
# the overlay file (docker-compose.gpu.yml) with a local or GHCR gpu image,
# plus NVIDIA runtime in the TrueNAS app. Do not add a GPU runtime to the
# CPU image — that image does not ship CUDA PyTorch.
# IMAGE_TAG=gpu only works after you build/push that tag yourself.

services:
  voice-separator:
    image: paladini/voice-separator:${IMAGE_TAG:-latest}
    container_name: voice-separator
    ports:
      - "7860:7860"
    volumes:
      - /mnt/tank/apps/voice-separator/output:/app/static/output
      - /mnt/tank/apps/voice-separator/cache:/root/.cache
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_HOME=/root/.cache/torch
    restart: unless-stopped
