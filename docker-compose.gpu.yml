# NVIDIA GPU overlay — use *with* docker-compose.yml, do not start both
# the default CPU service and the GPU profile on port 7860 at once.
#
# Recommended (replaces the CPU service image/runtime in place):
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
#
# Equivalent profile form (starts only the gpu service):
#   docker compose --profile gpu up -d voice-separator-gpu
#
# Host requirements: NVIDIA driver + NVIDIA Container Toolkit.
# Image: paladini/voice-separator:gpu  (not :latest)

services:
  voice-separator:
    image: paladini/voice-separator:gpu
    build:
      context: .
      dockerfile: Dockerfile.gpu
    gpus: all
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_HOME=/root/.cache/torch
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
